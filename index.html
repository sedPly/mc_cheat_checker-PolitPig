<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeGen | Ключи для MC Cheat Checker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'JetBrains Mono',Consolas,monospace}
body{background:linear-gradient(135deg,#0a0a1a,#1a0a2e,#0a1a2e);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px}
h1{font-size:28px;margin-bottom:6px}h1 span{color:#00f5a0}
.sub{color:#888;font-size:13px;margin-bottom:28px}
.card{width:100%;max-width:560px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:20px;margin-bottom:18px;backdrop-filter:blur(12px)}
.card h2{font-size:15px;color:#00f5a0;margin-bottom:14px}
button{cursor:pointer;border:none;border-radius:10px;font-family:inherit;font-weight:700}
.gen-btn{flex:1;padding:12px;background:linear-gradient(135deg,#00f5a0,#00d9f5);color:#000;font-size:14px}
.gen-btn:hover{box-shadow:0 8px 24px rgba(0,245,160,.35)}
.row{display:flex;gap:8px;margin-bottom:12px}
select{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#fff;padding:10px;border-radius:10px;font-family:inherit}
.codes{margin-top:14px;display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.code-item{display:flex;justify-content:space-between;align-items:center;background:rgba(0,245,160,.07);border:1px solid rgba(0,245,160,.25);padding:8px 10px;border-radius:8px;font-size:14px;color:#00f5a0}
.copy{background:rgba(255,255,255,.08);color:#ccc;padding:4px 8px;font-size:12px}
input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#fff;padding:10px;border-radius:10px;font-family:inherit;font-size:14px;letter-spacing:1px}
.check-btn{width:100%;margin-top:10px;padding:11px;background:rgba(0,217,245,.15);color:#00d9f5;font-size:14px}
.verdict{margin-top:12px;padding:10px;border-radius:10px;text-align:center;font-size:14px;display:none}
.verdict.ok{display:block;background:rgba(0,245,160,.15);color:#00f5a0}
.verdict.bad{display:block;background:rgba(255,60,60,.15);color:#ff6b6b}
a.dl{display:inline-block;margin-top:4px;color:#00d9f5;font-size:13px}
.foot{color:#555;font-size:11px;margin-top:8px;text-align:center}
</style>
</head>
<body>
<h1>Code<span>Gen</span> // KeyCheck</h1>
<div class="sub">Генератор оригинальных кодов для MC Cheat Checker v2</div>

<div class="card">
  <h2>⚡ Генерация кодов</h2>
  <div class="row">
    <select id="count"><option>1</option><option>5</option><option>10</option></select>
    <button class="gen-btn" id="gen">Сгенерировать</button>
  </div>
  <div class="codes" id="codes"></div>
  <button class="copy" id="copyAll" style="width:100%;margin-top:10px;display:none">📋 Копировать все</button>
</div>

<div class="card">
  <h2>🔎 Проверка кода</h2>
  <input id="vin" placeholder="XXXX-XXXX-XXXX-CCCC">
  <button class="check-btn" id="verify">Проверить оригинальность</button>
  <div class="verdict" id="verdict"></div>
</div>

<a class="dl" href="./mc_cheat_checker.ps1" download>💾 Скачать MC Cheat Checker (.ps1)</a>
<div class="foot">Коды подписаны общим секретом с чекером. Подделка проверку не пройдёт.</div>

<script>
const SECRET = "SEDP1Y-MC-2026-SECRET"; // ДОЛЖЕН совпадать с $KeyCodeSecret в mc_cheat_checker.ps1
const ALPHA = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
function fnv1a(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h=(h^s.charCodeAt(i))>>>0;h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function checksum(p){let h=fnv1a(p+SECRET),o="";for(let i=0;i<4;i++){o+=ALPHA[h%36];h=Math.floor(h/36);}return o;}
function gen(){let p="";for(let i=0;i<12;i++)p+=ALPHA[Math.floor(Math.random()*36)];return p.slice(0,4)+"-"+p.slice(4,8)+"-"+p.slice(8,12)+"-"+checksum(p);}
function verify(c){const cl=(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");if(cl.length!==16)return{ok:false,why:"формат XXXX-XXXX-XXXX-CCCC (16 символов)"};return checksum(cl.slice(0,12))===cl.slice(12)?{ok:true}:{ok:false,why:"подпись не совпадает — код поддельный"};}
let list=[];
const codesEl=document.getElementById('codes'),copyAll=document.getElementById('copyAll');
document.getElementById('gen').onclick=()=>{const n=+document.getElementById('count').value;for(let i=0;i<n;i++)list.unshift(gen());list=list.slice(0,50);render();};
function render(){codesEl.innerHTML=list.map((c,i)=>'<div class="code-item"><span>'+c+'</span><button class="copy" data-i="'+i+'">📋</button></div>').join('');copyAll.style.display=list.length?'block':'none';codesEl.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(list[+b.dataset.i]);b.textContent='✓';setTimeout(()=>b.textContent='📋',1200);});}
copyAll.onclick=()=>navigator.clipboard.writeText(list.join('\n'));
document.getElementById('verify').onclick=()=>{const r=verify(document.getElementById('vin').value);const v=document.getElementById('verdict');v.className='verdict '+(r.ok?'ok':'bad');v.textContent=r.ok?'✅ ОРИГИНАЛ: подпись верная, чекер примет этот код':'❌ ПОДЕЛКА: '+r.why;};
</script>
</body>
</html>
